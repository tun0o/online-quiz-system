spring.application.name=online-quiz-system

# DB
spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB:quizdb}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration_completed

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true

# JWT
app.jwt.secret=${JWT_SECRET:fOQfI6J+7jjVnPMqSdWIQsYoA/6tLKVj47Gy1cr2tS8=}
app.jwt.expiration-ms=86400000   
app.jwt.refresh-expiration-ms=604800000  

# Server
server.port=8080
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.oauth2.authorizedRedirectUri=${app.frontend.url}/oauth2/redirect

# CORS
spring.web.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
app.frontend.origin=${APP_FRONTEND_ORIGIN:http://localhost:5173}

# Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# logging
logging.level.com.example.online_quiz_system=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG
# OAuth2 clients
spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${APP_BACKEND_URL:http://localhost:8080}/login/oauth2/code/google

spring.security.oauth2.client.registration.facebook.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_ID:}
spring.security.oauth2.client.registration.facebook.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_SECRET:}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.redirect-uri=${APP_BACKEND_URL:http://localhost:8080}/login/oauth2/code/facebook

# VNPAY CONFIG
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:${APP_BACKEND_URL:http://localhost:8080}/api/payment/vnpay-return}
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.version=2.1.0

# MinIO Configuration
minio.url=${MINIO_URL:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.access-key=${MINIO_ROOT_USER:minio}
minio.secret-key=${MINIO_ROOT_PASSWORD:minio123}
minio.bucket-name=practizz-bucket

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
