name: Entry Deploy (Docker + SSH)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend/online-quiz-system
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:backend-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:backend-latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend/frontend
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.FRONTEND_VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:frontend-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:frontend-latest

      - name: Copy production compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: docker/docker-compose.prod.yml
          target: /opt/online-quiz-system

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_ENV_B64: ${{ secrets.PROD_ENV_B64 }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          BACKEND_IMAGE: ${{ env.IMAGE_NAME }}:backend-${{ github.sha }}
          FRONTEND_IMAGE: ${{ env.IMAGE_NAME }}:frontend-${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail

            sudo mkdir -p /opt/online-quiz-system
            sudo chown -R "$USER":"$USER" /opt/online-quiz-system
            cd /opt/online-quiz-system

            if [ -z "${PROD_ENV_B64}" ]; then
              echo "PROD_ENV_B64 is empty" >&2
              exit 1
            fi

            echo "$PROD_ENV_B64" | base64 -d > .env

            # Ensure images are pinned to this deploy
            grep -v '^BACKEND_IMAGE=' .env | grep -v '^FRONTEND_IMAGE=' > .env.tmp || true
            mv .env.tmp .env
            echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> .env
            echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> .env

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d

            docker image prune -f
